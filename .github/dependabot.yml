# .github/dependabot.yml
version: 2

updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Prague"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: "scope"
    groups:
      eslint:
        patterns:
          - "eslint*"
          - "@eslint/*"
          - "@next/eslint-plugin-next"
          - "typescript-eslint"
          - "@typescript-eslint/*"
      # Batch the boring stuff into one PR; keep majors separate.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
      types-definitions:
        patterns:
          - "@types/*"
    ignore:
      # Example: hold major bumps on framework-level deps for manual review.
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]

  # ─────────────────────────────────────────────────────────────
  # Keep the pipeline itself current too. Cheap insurance.
  # ─────────────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"
